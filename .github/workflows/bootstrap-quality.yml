name: Bootstrap quality tooling

on:
  push:
    branches: [chore/biome-coverage-ci]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/biome-coverage-ci

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install quality dependencies and update lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply Biome formatting and safe fixes
        run: npx biome check --write src index.ts vitest.config.ts || true

      - name: Commit generated baseline
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src index.ts vitest.config.ts
          git commit -m "chore: bootstrap quality baseline"
          git push origin HEAD:chore/biome-coverage-ci
