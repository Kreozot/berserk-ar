name: Import Legends of Laar cards

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 19 Legends of Laar card images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/cards/legends-of-laar
          for n in $(seq 1 19); do
            id=$(printf '%03d' "$n")
            url="https://www.proberserk.ru/images/cards/ll/ll-${id}.jpg"
            out="assets/cards/legends-of-laar/ll-${id}.jpg"
            echo "Downloading $url"
            curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$out"
            test -s "$out"
          done

      - name: Verify image count
        shell: bash
        run: |
          count=$(find assets/cards/legends-of-laar -maxdepth 1 -type f -name 'll-*.jpg' | wc -l)
          test "$count" -eq 19

      - name: Commit imported images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/legends-of-laar

          if git diff --cached --quiet; then
            echo "Images already present; nothing to commit."
            exit 0
          fi

          git commit -m "data: import Legends of Laar card images"
          git push
