name: Bootstrap Biome baseline

on:
  push:
    branches: [chore/biome-coverage-ci]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/biome-coverage-ci

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm ci

      - name: Apply formatter
        run: npx biome format --write src index.ts vitest.config.ts

      - name: Apply safe lint and assist fixes
        run: npx biome check --write src index.ts vitest.config.ts || true

      - name: Commit Biome baseline
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src index.ts vitest.config.ts
          git commit -m "style: apply Biome baseline"
          git push origin HEAD:chore/biome-coverage-ci
