name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Biome check
        run: npm run check

      - name: Unit tests with coverage
        run: npm run test:coverage

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          start=$(date +%s)
          trap 'echo "- npm ci: $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"' EXIT
          npm ci

      - name: Generate Android project
        run: |
          start=$(date +%s)
          trap 'echo "- Expo prebuild: $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"' EXIT
          npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Compile Android debug app
        working-directory: android
        run: |
          start=$(date +%s)
          trap 'echo "- Gradle assembleDebug: $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"' EXIT
          ./gradlew assembleDebug --no-daemon --build-cache -x lint -x test -PreactNativeArchitectures=arm64-v8a
