name: Generate ORB references

on:
  push:
    branches: [feature/orb-recognition]
    paths:
      - 'scripts/generate_orb_reference_descriptors.py'
      - 'assets/cards/legends-of-laar/**'
      - 'data/cards/legends-of-laar.json'
      - '.github/workflows/generate-orb-references.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/orb-recognition

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenCV
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy

      - name: Generate descriptors and validation report
        run: python scripts/generate_orb_reference_descriptors.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/recognition/orb/referenceDescriptors.generated.ts docs/orb-reference-validation.md
          git diff --cached --quiet || git commit -m "chore: generate ORB reference descriptors"
          git push
